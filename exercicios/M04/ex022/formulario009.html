<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="cadastro.php">

        <p>
           <label for="inum">Numero</label>
           <input type="range" name="num" id="inum" min="1" max="5" required value="3" oninput="ival.innerHTML = Number(inum.value)">
           <output id="ival">3</output>
        </p>
        
        <p>
                <input type="submit" value="Enviar">
        </p>
    </form>
</body>
</html>

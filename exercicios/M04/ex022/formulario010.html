<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php">

        <p>
            <label for="ano">Nascimento</label>
            <input type="number" name="ano" id="ano" min="1900" max="2026" required oninput="CalcIdade()">
        </p>

        <p><label for="idade">Sua idade e </label>
            <output id="idade">0</output>
        </p>



        <p>
                <input type="submit" value="Enviar">
        </p>
    </form>

    <script>
        function CalcIdade() {
            let atual = new Date().getFullYear()
            idade.innerHTML = Number(atual) - Number(ano.value)
        }
    </script>
</body>
</html>

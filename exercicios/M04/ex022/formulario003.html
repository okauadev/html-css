<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <p>
        <form action="cadastro.php">
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome">
    </p>
    <p>
        <label for="imedia">Media</label>
        <input type="number" name="media" id="imedia" min="0" max="10" step="0.1">
    </p>
    <p>
        <label for="imes">Periodo letivo</label>
        <input type="month" name="mes" id="imes">
    </p>
    <p>
        <label for="idia">Dia da prova</label>
        <input type="date" name="dia" id="idia">
    </p>
    <p>
        <label for="ihora"></label>
        <input type="time" name="hora" id="ihora">
    </p>
    <p>
        <input type="submit" value="Enviar">
    </p>
    </form>
</body>
</html>
